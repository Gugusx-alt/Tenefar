# Build do Flutter Web e publicação no GitHub Pages.
# Ative em: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # O site fica em https://USUARIO.github.io/NOME_DO_REPOSITORIO/
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # Com URLs limpas (/calculadora), o GitHub Pages devolve 404 ao recarregar
      # a página; servir o próprio app como 404.html resolve isso.
      - name: Copiar index.html para 404.html
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
