<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    O valor abaixo é substituído pelo argumento --base-href do `flutter build web`.
    No GitHub Pages use: --base-href /NOME_DO_REPOSITORIO/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1A2C30">

  <title>TENEFAR · Pó nutricional proteico de Tenebrio molitor</title>
  <meta name="description" content="Projeto de Iniciação Científica (PIBIC) da Unioeste: desenvolvimento de pó nutricional proteico à base de Tenebrio molitor para suporte nutricional em casos de desnutrição aguda. Conheça o projeto e use a calculadora de substituição proteica.">
  <meta name="keywords" content="Tenebrio molitor, suplementação alimentar, desnutrição aguda, Unioeste, PIBIC, proteína alternativa">

  <!-- Open Graph (pré-visualização ao compartilhar o link) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="TENEFAR">
  <meta property="og:title" content="TENEFAR · Pó nutricional proteico de Tenebrio molitor">
  <meta property="og:description" content="Projeto PIBIC/Unioeste: proteína de baixo custo a partir da larva-da-farinha para suporte nutricional em casos de desnutrição aguda. Inclui calculadora de substituição proteica.">
  <!-- TROQUE AQUI: para a imagem aparecer nas redes, use a URL completa, ex.:
       https://SEU_USUARIO.github.io/NOME_DO_REPOSITORIO/og-image.png -->
  <meta property="og:image" content="og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TENEFAR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Tela de carregamento enquanto o Flutter inicia. */
    body { margin: 0; background: #F3EFE6; }
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, sans-serif; color: #1A2C30;
    }
    #carregando img { width: 96px; height: 96px; }
    @media (prefers-color-scheme: dark) { body { background: #0F1B1D; } #carregando { color: #EDE8DD; } }
  </style>
</head>
<body>
  <div id="carregando" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Carregando TENEFAR…</span>
  </div>
  <noscript>Este site precisa de JavaScript para funcionar.</noscript>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove a tela de carregamento quando o primeiro quadro do Flutter aparece.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
</body>
</html>
